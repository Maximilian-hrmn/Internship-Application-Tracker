<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship-Application-Tracker</title>
</head>
<body>
    <h1>Internship Application Tracker</h1>
    <p>Welcome to the Internship Application Tracker this tool helps you manage your internship applications.
        Track companies, deadlines, interview rounds, recruiter contacts and follow-up dates. </p>
    
    <form id="application-form">
    <label for="company">Firma</label>
    <input type="text" id="company" required>
    <br><br>
    <label for="position">Stelle</label>
    <input type="text" id="position" required>
    <br><br>
    <label for="status">Status</label>
    <select id="status">
    <option value="applied">Beworben</option>
    <option value="interview">Interview</option>
    <option value="rejection">Abgesagt</option>
    <option value="accepted">Zusage</option>
    </select>
    <br><br>
    <button type="submit">Hinzufügen</button>
    </form>
    <script src="app.js"></script>
</body>
</html>
